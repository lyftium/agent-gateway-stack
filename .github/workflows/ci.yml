name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Gateway overhead benchmark (smoke, not a measurement)
        run: python bench/gateway_overhead.py --requests 200 --repeats 1 --out /tmp/bench.json

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema==4.23.0 PyYAML==6.0.2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: make validate

  image:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agent-gateway-stack:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: End-to-end through docker compose
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs localhost:8000/v1/agent/runs -H 'content-type: application/json' \
            -d '{"task": "Air density at 11000 m in the ISA model?"}' | tee /tmp/run.json
          python -c "import json; r=json.load(open('/tmp/run.json')); assert r['status']=='completed', r"
          docker run --rm --entrypoint id agent-gateway-stack:${{ github.sha }} -u | grep -qx 10001

  ghcr:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint-test, image]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lyftium/agent-gateway-stack:dev
            ghcr.io/lyftium/agent-gateway-stack:0.1.0
            ghcr.io/lyftium/agent-gateway-stack:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false
      - name: Record digest artifact
        run: |
          mkdir -p digests
          DIGEST='${{ steps.push.outputs.digest }}'
          echo "image=ghcr.io/lyftium/agent-gateway-stack" > digests/agent-gateway-stack.txt
          echo "tag=dev,0.1.0,sha-${{ github.sha }}" >> digests/agent-gateway-stack.txt
          echo "digest=${DIGEST}" >> digests/agent-gateway-stack.txt
          echo "git=${{ github.sha }}" >> digests/agent-gateway-stack.txt
          echo "recorded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> digests/agent-gateway-stack.txt
          cat digests/agent-gateway-stack.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-digest-agent-gateway-stack
          path: digests/agent-gateway-stack.txt
