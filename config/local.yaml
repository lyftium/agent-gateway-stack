# docker compose / local runs. Keys are dev-only and public:
#   agent: dev-agent-key   team: dev-team-key
# Tenants are identified by sha256(key); plaintext keys never go in this file.
routes:
  - alias: chat
    upstreams:
      - name: mock
        base_url: http://mockllm:8080/v1
        model: mock
        timeout_s: 30
tenants:
  - name: agent
    key_sha256: 768d431c7599a91b58ae5747e08e9aa96dcb4eef45e029c87e3e060e521dcead
    models: [chat]
    requests_per_minute: 600
    tokens_per_minute: 200000
    max_tokens: 512
  - name: team
    key_sha256: 08ac194c207da1055fcbec5369fade23167a8f560b8c9594eb5f682809b8cab3
    models: [chat]
    requests_per_minute: 60
    tokens_per_minute: 50000
    max_tokens: 1024
