apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qwen-tools-predictor
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: qwen-tools
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - port: 8080
