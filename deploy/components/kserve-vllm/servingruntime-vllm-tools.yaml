# vLLM with OpenAI tool calling enabled. `--tool-call-parser hermes` matches
# the Qwen2.5 chat template; other model families need their own parser.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-openai-tools
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM with tool calling (OpenAI-compatible API)
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  containers:
    - name: kserve-container
      image: vllm/vllm-openai:v0.6.4
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
        - --disable-log-requests
      env:
        - {name: HOME, value: /tmp}
        - {name: XDG_CACHE_HOME, value: /tmp/.cache}
        - {name: HF_HUB_OFFLINE, value: "1"}
      ports:
        - {containerPort: 8080, protocol: TCP}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumeMounts:
        - {name: shm, mountPath: /dev/shm}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: shm
      emptyDir: {medium: Memory, sizeLimit: 4Gi}
    - name: tmp
      emptyDir: {sizeLimit: 4Gi}
